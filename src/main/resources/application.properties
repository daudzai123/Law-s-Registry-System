# Default profile selector - uncomment the one you need
# For LOCAL development (Windows):
# spring.profiles.active=local




# For SERVER production (Linux):
# spring.profiles.active=server
spring.profiles.active=server

# Common properties (shared between environments)
spring.application.name=LawMIS

# Database connection (can be overridden in profiles)
spring.datasource.driver-class-name=org.postgresql.Driver
datasource.name=lawDB

# File upload settings
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

# JPA common settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Email configuration (same for all environments)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=idreesdaudzai2000@gmail.com
spring.mail.password=avox vnib gjkm hyxi
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# File storage - Leave empty for auto-detection
# If empty, will automatically use: {user.home}/LawMIS/attachment/
# Add these lines to your properties file
file.storage.base-path=D:\Law's Registry System\attachment
file.storage.laws-subdir=laws
file.storage.profile-subdir=profileImages

# Backup path - Auto-detected if empty
backup.path=
attachments.path=

# PostgreSQL paths - Auto-detected if empty
pgdump.address=
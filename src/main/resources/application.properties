spring.profiles.active=server

# Friday 02:00 in Kabul; hourly retries and startup catch-up. Backend must be running.
backup.weekly.enabled=${BACKUP_WEEKLY_ENABLED:true}
backup.weekly.zone=${BACKUP_WEEKLY_ZONE:Asia/Kabul}
backup.process-timeout-seconds=${BACKUP_PROCESS_TIMEOUT_SECONDS:1800}

spring.application.name=LawMIS

spring.datasource.driver-class-name=org.postgresql.Driver
datasource.name=lawDB

# Upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=idreesdaudzai2000@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD:CHANGE_THIS_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

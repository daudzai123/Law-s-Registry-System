spring.application.name=LawMIS

server.port=8081
server.address=localhost

spring.datasource.url=jdbc:postgresql://localhost:5432/lawDB
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver
datasource.name=lawDB

# Upload
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=4GB
spring.servlet.multipart.enabled=true

# Backup
backup.path=C:/lawmis/backups/
pgdump.address=${PG_DUMP_PATH:pg_dump}
pgrestore.address=${PG_RESTORE_PATH:pg_restore}
file.storage.base-path=D:/Law's Registry System/attachment
attachments.path=D:/Law's Registry System/attachment/

# Attachments
attachments.path=D:/Law's Registry System/attachment/
file.storage.base-path=D:/Law's Registry System/attachment
file.storage.laws-subdir=laws
file.storage.registry-subdir=registry
file.storage.profile-subdir=profileImages

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logging
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=idreesdaudzai2000@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD:CHANGE_THIS_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
